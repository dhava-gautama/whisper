<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c0467b">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <title>Whisper</title>
    <meta name="description" content="Private encrypted chat">
    <meta property="og:title" content="Whisper">
    <meta property="og:description" content="Private encrypted chat">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="/css/style.css?v=1.0.1">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
                </svg>
            </div>
            <h1>Whisper</h1>
            <p class="login-subtitle">Enter your password to continue</p>
            <form id="login-form">
                <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus class="login-input">
                <button type="submit" id="submit-btn" class="login-btn">Enter</button>
                <p id="error" class="error" hidden></p>
            </form>
        </div>
    </div>
    <script src="/js/login.js?v=1.0.1"></script>
</body>
</html>
