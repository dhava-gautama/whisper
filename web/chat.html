<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#c0467b">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <title>Whisper</title>
    <link rel="stylesheet" href="/css/style.css?v=1.0.2">
</head>
<body class="chat-page">
    <header id="header">
        <div class="header-left">
            <div class="header-logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
                </svg>
            </div>
            <div class="header-info">
                <h1>Whisper</h1>
                <span id="peer-status" class="peer-status">
                    <span id="peer-dot" class="dot offline"></span>
                    <span id="peer-name">Offline</span>
                    <span id="ping-display" class="ping-display"></span>
                </span>
            </div>
        </div>
        <div class="header-actions">
            <button id="search-toggle" class="icon-btn" title="Search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
            <input type="file" id="wallpaper-input" accept="image/*" hidden>
            <button id="menu-toggle" class="icon-btn" title="Menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
                </svg>
            </button>
            <div id="overflow-menu" class="overflow-menu" hidden>
                <button id="gallery-btn"><span>Gallery</span></button>
                <button id="sound-toggle"><span id="sound-label">Mute</span></button>
                <button id="theme-toggle"><span id="theme-label">Light mode</span></button>
                <button id="wallpaper-btn"><span>Set wallpaper</span></button>
                <button id="clear-wallpaper-btn"><span>Clear wallpaper</span></button>
                <button id="export-btn"><span>Export chat</span></button>
                <button id="change-password-btn"><span>Change password</span></button>
                <hr>
                <button id="logout-btn" class="danger"><span>Logout</span></button>
            </div>
        </div>
    </header>

    <div id="search-bar" class="search-bar" hidden>
        <input type="text" id="search-input" placeholder="Search messages..." autocomplete="off">
        <button id="search-close" class="icon-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div id="search-results" class="search-results" hidden></div>

    <main id="messages" class="messages">
        <div id="load-more" class="load-more" hidden>
            <button id="load-more-btn">Load older messages</button>
        </div>
        <div id="message-list"></div>
        <div id="empty-state" class="empty-state">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
            </svg>
            <p>No messages yet</p>
            <p class="empty-hint">Send a message to start the conversation</p>
        </div>
    </main>

    <button id="scroll-bottom-btn" class="scroll-bottom-btn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        <span id="scroll-badge" class="scroll-badge" hidden></span>
    </button>

    <div id="typing-indicator" class="typing-indicator" hidden>
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span id="typing-name"></span> is typing
    </div>

    <div id="reply-preview" class="reply-preview" hidden>
        <div class="reply-preview-content">
            <span class="reply-preview-name" id="reply-preview-name"></span>
            <span class="reply-preview-text" id="reply-preview-text"></span>
        </div>
        <button id="reply-cancel" class="icon-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <footer class="input-area">
        <button id="attach-btn" class="icon-btn" title="Attach file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
            </svg>
        </button>
        <button id="voice-btn" class="icon-btn" title="Voice message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
        </button>
        <input type="file" id="file-input" hidden>
        <div class="input-wrapper">
            <textarea id="message-input" placeholder="Type a message..." autocomplete="off" rows="1"></textarea>
        </div>
        <button id="send-btn" class="icon-btn send" title="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </footer>

    <div id="upload-progress" class="upload-progress" hidden>
        <div id="upload-bar" class="upload-bar"></div>
    </div>

    <div id="reconnect-banner" class="reconnect-banner" hidden>
        <span class="reconnect-spinner"></span> Reconnecting...
    </div>

    <div id="toast" class="toast"></div>

    <div id="lightbox" class="lightbox" hidden>
        <img id="lightbox-img" src="">
        <button id="lightbox-close" class="lightbox-close">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>

    <div id="context-menu" class="context-menu" hidden>
        <button data-action="reply">Reply</button>
        <button data-action="copy">Copy text</button>
        <div class="context-reactions">
            <button data-action="react" data-emoji="👍">👍</button>
            <button data-action="react" data-emoji="❤️">❤️</button>
            <button data-action="react" data-emoji="😂">😂</button>
            <button data-action="react" data-emoji="😮">😮</button>
            <button data-action="react" data-emoji="🔥">🔥</button>
            <button data-action="react" data-emoji="👎">👎</button>
        </div>
        <button data-action="delete" class="danger">Delete</button>
    </div>

    <div id="gallery-modal" class="gallery-modal" hidden>
        <div class="gallery-header">
            <h2>Media Gallery</h2>
            <button id="gallery-close" class="icon-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div id="gallery-grid" class="gallery-grid"></div>
    </div>

    <div id="drop-overlay" class="drop-overlay" hidden>
        <div class="drop-content">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            <p>Drop file to send</p>
        </div>
    </div>

    <div id="voice-recording" class="voice-recording" hidden>
        <div class="voice-dot"></div>
        <span id="voice-timer">0:00</span>
        <button id="voice-cancel" class="icon-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <button id="voice-send" class="icon-btn send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
    </div>

    <div id="password-modal" class="modal-overlay" hidden>
        <div class="modal-card">
            <h3>Change Password</h3>
            <input type="password" id="old-pass" placeholder="Current password" autocomplete="current-password">
            <input type="password" id="new-pass" placeholder="New password" autocomplete="new-password">
            <div class="modal-actions">
                <button id="pass-cancel" class="modal-btn">Cancel</button>
                <button id="pass-save" class="modal-btn primary">Save</button>
            </div>
            <p id="pass-error" class="error" hidden></p>
        </div>
    </div>

    <script src="/js/chat.js?v=1.0.2"></script>
</body>
</html>
